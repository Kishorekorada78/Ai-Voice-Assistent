<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Studio</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #eceff7;
    --surface: #ffffff;
    --ink: #14172e;
    --muted: #596083;
    --line: #d3d8ea;
    --soft: #e4e8f8;
    --cobalt: #3347ff;
    --on-cobalt: #ffffff;
    --rec: #cf2a43;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1126;
      --surface: #171b37;
      --ink: #eceefb;
      --muted: #9aa1c9;
      --line: #2b3060;
      --soft: #222750;
      --cobalt: #7d8dff;
      --on-cobalt: #0e1126;
      --rec: #ff6580;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.5;
    padding: clamp(24px, 12vh, 120px) 20px 48px;
  }

  main { width: 100%; max-width: 720px; margin: 0 auto; }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(2rem, 5.4vw, 3.1rem);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.025em;
  }
  .lede {
    margin: 0 0 32px;
    max-width: 46ch;
    color: var(--muted);
    font-size: 1.0625rem;
  }

  /* ---------- the bar ---------- */
  .bar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 14px 12px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 34px;
    box-shadow: 0 14px 34px -18px rgba(20, 23, 46, 0.35);
    transition: border-color .15s, box-shadow .15s;
  }
  .bar:focus-within {
    border-color: var(--cobalt);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--cobalt) 26%, transparent);
  }
  .bar[data-mode="recording"] { border-color: var(--rec); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rec) 22%, transparent); }

  .tools {
    display: flex;
    gap: 8px;
    padding-right: 12px;
    border-right: 1px solid var(--line);
  }

  .icon-btn {
    flex: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, transform .1s, filter .15s;
  }
  .icon-btn:hover:not(:disabled) { background: var(--soft); }
  .icon-btn:active:not(:disabled) { transform: scale(0.95); }
  .icon-btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .icon-btn:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--cobalt);
    outline-offset: 2px;
  }
  .icon-btn svg { width: 22px; height: 22px; display: block; }

  .icon-btn.primary {
    background: var(--cobalt);
    border-color: transparent;
    color: var(--on-cobalt);
  }
  .icon-btn.primary:hover:not(:disabled) { background: var(--cobalt); filter: brightness(1.1); }

  .icon-btn.quiet { border-color: transparent; color: var(--muted); }

  /* icon swapping by state */
  .icon-btn .ico-spin, .icon-btn .eq { display: none; }
  .bar[data-mode="loadingTts"] #speak .ico-main,
  .bar[data-mode="playing"] #speak .ico-main,
  .bar[data-mode="transcribing"] #mic .ico-main { display: none; }
  .bar[data-mode="loadingTts"] #speak .ico-spin,
  .bar[data-mode="transcribing"] #mic .ico-spin { display: block; }
  .bar[data-mode="playing"] #speak .eq { display: flex; }
  .bar[data-mode="loadingTts"] #speak:disabled,
  .bar[data-mode="transcribing"] #mic:disabled { opacity: 1; }
  .ico-spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .eq { gap: 3px; align-items: center; height: 20px; }
  .eq span { width: 3px; height: 30%; border-radius: 2px; background: currentColor; }
  .eq:not(.live) span { animation: bounce 0.9s ease-in-out infinite; }
  .eq:not(.live) span:nth-child(2) { animation-delay: .15s; }
  .eq:not(.live) span:nth-child(3) { animation-delay: .3s; }
  .eq:not(.live) span:nth-child(4) { animation-delay: .45s; }
  @keyframes bounce { 0%, 100% { height: 25%; } 50% { height: 100%; } }

  .field { flex: 1; min-width: 0; display: flex; }
  textarea {
    width: 100%;
    max-height: 200px;
    padding: 10px 4px;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1.0625rem;
    line-height: 24px;
  }
  textarea::placeholder { color: var(--muted); opacity: 0.85; }
  textarea:disabled { opacity: 0.6; }

  /* ---------- recording state ---------- */
  .rec-panel { display: none; flex: 1; min-width: 0; align-items: center; gap: 12px; height: 44px; padding-left: 8px; }
  .rec-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .timer { flex: none; min-width: 3.2ch; font-variant-numeric: tabular-nums; color: var(--ink); }
  #wave { flex: 1; min-width: 0; width: 100%; height: 44px; display: block; }
  .rec-actions { display: none; gap: 8px; }

  .bar[data-mode="recording"] .rec-panel { display: flex; }
  .bar[data-mode="recording"] .rec-actions { display: flex; }
  .bar[data-mode="recording"] .idle-only { display: none !important; }

  /* ---------- below the bar ---------- */
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
  .meta .label { color: var(--muted); font-size: 0.9375rem; margin-right: 2px; }
  .voices { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.9375rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .chip:hover { background: var(--soft); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .count { margin-left: auto; color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
  .count.warn { color: var(--rec); }

  .status { min-height: 1.6em; margin: 18px 0 0; color: var(--muted); font-size: 1rem; }
  .status.error { color: var(--rec); }

  @media (max-width: 520px) {
    .bar { border-radius: 28px; padding: 10px 10px 10px 10px; }
    .tools { padding-right: 8px; gap: 6px; }
    .count { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rec-dot, .eq:not(.live) span { animation: none; }
    .eq:not(.live) span { height: 60%; }
    .ico-spin { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
<main>
  <h1>Type it, say it, hear it.</h1>
  <p class="lede">Tap the mic to turn your voice into text. Tap the speaker to hear any text read aloud.</p>

  <div class="bar" id="bar" data-mode="idle">

    <div class="tools idle-only">
      <button class="icon-btn" id="mic" type="button" aria-label="Dictate with microphone" title="Dictate">
        <svg class="ico-main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
        <svg class="ico-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" opacity="0.9"></path></svg>
      </button>

      <button class="icon-btn primary" id="speak" type="button" aria-label="Read aloud" title="Read aloud">
        <svg class="ico-main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6.5 9H3v6h3.5L11 19z" fill="currentColor"></path>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
          <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
        </svg>
        <svg class="ico-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
        <span class="eq" id="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      </button>
    </div>

    <div class="field idle-only">
      <textarea id="text" rows="1" maxlength="1000" spellcheck="true"
        placeholder="Write something to hear, or tap the mic and say it"></textarea>
    </div>

    <button class="icon-btn quiet idle-only" id="clear" type="button" aria-label="Clear text" title="Clear" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>

    <div class="rec-panel">
      <span class="rec-dot" aria-hidden="true"></span>
      <span class="timer" id="timer">0:00</span>
      <canvas id="wave" aria-hidden="true"></canvas>
    </div>
    <div class="rec-actions">
      <button class="icon-btn" id="cancel" type="button" aria-label="Discard recording" title="Discard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
      <button class="icon-btn primary" id="done" type="button" aria-label="Finish and transcribe" title="Finish and transcribe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      </button>
    </div>
  </div>

  <div class="meta">
    <span class="label" id="voice-label">Voice</span>
    <div class="voices" role="group" aria-labelledby="voice-label" id="voices">
      <button class="chip" type="button" aria-pressed="true">Kore</button>
      <button class="chip" type="button" aria-pressed="false">Puck</button>
      <button class="chip" type="button" aria-pressed="false">Charon</button>
      <button class="chip" type="button" aria-pressed="false">Leda</button>
      <button class="chip" type="button" aria-pressed="false">Aoede</button>
      <button class="chip" type="button" aria-pressed="false">Fenrir</button>
    </div>
    <span class="count" id="count">0 / 1000</span>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>

<script>
(() => {
  'use strict';

  /* ---------- settings ---------- */
  const API_STT = '/api/stt/transcribe';   // POST multipart "file"  -> { "text": "..." }
  const API_TTS = '/api/tts';              // POST form text, voice  -> audio/wav
  const MAX_CHARS = 1000;                  // must match the server limit
  const MAX_REC_SEC = 60;                  // recording stops by itself here
  const MIN_REC_SEC = 0.6;                 // shorter clips are ignored
  const TARGET_RATE = 16000;               // Gemini expects 16 kHz speech

  /* ---------- elements ---------- */
  const $ = s => document.querySelector(s);
  const bar = $('#bar'), input = $('#text'), micBtn = $('#mic'), speakBtn = $('#speak');
  const clearBtn = $('#clear'), cancelBtn = $('#cancel'), doneBtn = $('#done');
  const canvas = $('#wave'), timerEl = $('#timer'), statusEl = $('#status'), countEl = $('#count');
  const eq = $('#eq'), eqBars = [...eq.querySelectorAll('span')];

  let mode = 'idle';      // idle | recording | transcribing | loadingTts | playing
  let voice = 'Kore';

  /* ---------- small helpers ---------- */
  function setMode(m) {
    mode = m;
    bar.dataset.mode = m;
    micBtn.disabled = m !== 'idle';
    speakBtn.disabled = !(m === 'idle' || m === 'playing');
    input.disabled = m === 'transcribing';
    const playing = m === 'playing';
    speakBtn.setAttribute('aria-label', playing ? 'Stop reading' : 'Read aloud');
    speakBtn.title = playing ? 'Stop' : 'Read aloud';
    refresh();
  }

  function setStatus(msg, kind = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  }

  function refresh() {
    const len = input.value.length;
    countEl.textContent = len + ' / ' + MAX_CHARS;
    countEl.classList.toggle('warn', len > MAX_CHARS * 0.9);
    clearBtn.hidden = !(len > 0 && mode === 'idle');
  }

  async function readError(res) {
    let detail = '';
    try {
      const j = await res.json();
      detail = j.message || j.error || '';
    } catch (e) { /* body was not JSON */ }
    return 'The server answered ' + res.status + (detail ? ': ' + detail : '.');
  }

  function friendly(err) {
    if (err instanceof TypeError) {
      return 'Couldn’t reach the server. Check that the Spring Boot app is running and that you opened this page from it.';
    }
    return err.message || 'Something went wrong. Try again.';
  }

  /* ---------- text box ---------- */
  input.addEventListener('input', () => { autosize(); refresh(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      speak();
    }
  });
  clearBtn.addEventListener('click', () => {
    input.value = '';
    autosize(); refresh(); setStatus('');
    input.focus();
  });

  $('#voices').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    voice = chip.textContent.trim();
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
  });

  /* =========================================================
     SPEECH TO TEXT  (mic -> WAV -> /api/stt/transcribe)
     ========================================================= */

  // Tiny audio worklet that hands us the raw microphone samples
  const workletUrl = URL.createObjectURL(new Blob([`
    class PcmTap extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) this.port.postMessage(ch.slice(0));
        return true;
      }
    }
    registerProcessor('pcm-tap', PcmTap);
  `], { type: 'text/javascript' }));

  let rec = null;

  async function startRecording() {
    if (mode !== 'idle') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('This browser can’t record audio. Open the page on localhost in Chrome, Edge or Firefox.', 'error');
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
    } catch (err) {
      setStatus(err.name === 'NotAllowedError'
        ? 'Microphone access is blocked. Allow it in the address bar, then tap the mic again.'
        : 'No microphone found. Connect one and try again.', 'error');
      return;
    }

    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    try {
      await ctx.resume();
      await ctx.audioWorklet.addModule(workletUrl);
    } catch (err) {
      stream.getTracks().forEach(t => t.stop());
      ctx.close();
      setStatus('Recording isn’t supported in this browser. Use a current version of Chrome, Edge or Firefox.', 'error');
      return;
    }

    const source = ctx.createMediaStreamSource(stream);
    const node = new AudioWorkletNode(ctx, 'pcm-tap');
    const mute = ctx.createGain();           // keeps the graph running without echoing your voice
    mute.gain.value = 0;
    source.connect(node); node.connect(mute); mute.connect(ctx.destination);

    rec = { stream, ctx, source, node, mute, chunks: [], samples: 0,
            levels: [], sum: 0, n: 0, startedAt: performance.now(), timers: [], raf: 0 };

    node.port.onmessage = e => {
      const f = e.data;
      rec.chunks.push(f);
      rec.samples += f.length;
      let s = 0;
      for (let i = 0; i < f.length; i++) s += f[i] * f[i];
      rec.sum += s; rec.n += f.length;
    };

    // every 60 ms: turn the loudness we heard into one bar of the waveform
    rec.timers.push(setInterval(() => {
      const level = rec.n ? Math.sqrt(rec.sum / rec.n) : 0;
      rec.levels.push(level);
      if (rec.levels.length > 400) rec.levels.shift();
      rec.sum = 0; rec.n = 0;
    }, 60));
    rec.timers.push(setInterval(tickTimer, 250));

    setMode('recording');
    timerEl.textContent = '0:00';
    setStatus('Listening. Tap the check when you’re done.');
    sizeCanvas();
    drawWave();
  }

  function tickTimer() {
    if (!rec) return;
    const sec = (performance.now() - rec.startedAt) / 1000;
    timerEl.textContent = Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
    if (sec >= MAX_REC_SEC) finishRecording();
  }

  function sizeCanvas() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  }
  window.addEventListener('resize', () => { if (rec) sizeCanvas(); });

  function drawWave() {
    if (!rec) return;
    const g = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.width, H = canvas.height;
    const step = 6 * dpr, barW = 3 * dpr;
    const count = Math.floor(W / step);
    const levels = rec.levels.slice(-count);

    g.clearRect(0, 0, W, H);
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--rec').trim() || '#cf2a43';
    g.lineWidth = barW;
    g.lineCap = 'round';

    levels.forEach((lvl, i) => {
      const x = W - (levels.length - i) * step + barW / 2;
      const h = Math.max(barW, Math.min(1, lvl * 6) * H);
      g.beginPath();
      g.moveTo(x, (H - h) / 2 + barW / 2);
      g.lineTo(x, (H + h) / 2 - barW / 2);
      g.stroke();
    });
    rec.raf = requestAnimationFrame(drawWave);
  }

  // stop the microphone and return everything we heard as one array of samples
  function stopCapture() {
    const r = rec;
    rec = null;
    r.timers.forEach(clearInterval);
    cancelAnimationFrame(r.raf);
    r.node.port.onmessage = null;
    try { r.source.disconnect(); r.node.disconnect(); r.mute.disconnect(); } catch (e) { /* already gone */ }
    r.stream.getTracks().forEach(t => t.stop());
    const rate = r.ctx.sampleRate;
    r.ctx.close();
    const data = new Float32Array(r.samples);
    let offset = 0;
    for (const c of r.chunks) { data.set(c, offset); offset += c.length; }
    return { data, rate, seconds: r.samples / rate };
  }

  function cancelRecording() {
    if (!rec) return;
    stopCapture();
    setMode('idle');
    setStatus('Recording discarded.');
  }

  async function finishRecording() {
    if (!rec) return;
    const { data, rate, seconds } = stopCapture();

    if (seconds < MIN_REC_SEC) {
      setMode('idle');
      setStatus('That was too short to transcribe. Tap the mic and speak a little longer.', 'error');
      return;
    }

    setMode('transcribing');
    setStatus('Transcribing…');
    let heard = '';
    try {
      const wav = encodeWav(resample(data, rate, TARGET_RATE), TARGET_RATE);
      const form = new FormData();
      form.append('file', wav, 'voice.wav');
      const res = await fetch(API_STT, { method: 'POST', body: form });
      if (!res.ok) throw new Error(await readError(res));
      const json = await res.json();
      heard = (json.text || '').trim();
      setStatus(heard ? '' : 'No speech detected. Move closer to the mic and try again.', heard ? '' : 'error');
    } catch (err) {
      setStatus(friendly(err), 'error');
    }
    setMode('idle');

    if (heard) {
      const joined = input.value.trim() ? input.value.trimEnd() + ' ' + heard : heard;
      input.value = joined.slice(0, MAX_CHARS);
      autosize(); refresh();
    }
    input.focus();
  }

  // average neighbouring samples down to the target rate (simple and good enough for speech)
  function resample(data, from, to) {
    if (from === to) return data;
    const ratio = from / to;
    const len = Math.floor(data.length / ratio);
    const out = new Float32Array(len);
    for (let i = 0; i < len; i++) {
      const start = Math.floor(i * ratio);
      const end = Math.min(Math.floor((i + 1) * ratio), data.length);
      let sum = 0;
      for (let j = start; j < end; j++) sum += data[j];
      out[i] = sum / Math.max(1, end - start);
    }
    return out;
  }

  // 16-bit mono WAV: 44-byte header followed by the samples
  function encodeWav(samples, rate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buffer);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, samples.length * 2, true);
    let o = 44;
    for (let i = 0; i < samples.length; i++, o += 2) {
      const x = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
    }
    return new Blob([buffer], { type: 'audio/wav' });
  }

  micBtn.addEventListener('click', startRecording);
  cancelBtn.addEventListener('click', cancelRecording);
  doneBtn.addEventListener('click', finishRecording);

  /* =========================================================
     TEXT TO SPEECH  (text -> /api/tts -> WAV -> speakers)
     ========================================================= */
  let audio = null, playCtx = null, analyser = null, eqRaf = 0;
  let lastKey = '', lastUrl = '';        // reuse the last result so replaying costs no quota

  async function speak() {
    if (mode === 'playing') { endPlayback(); setStatus(''); return; }
    if (mode !== 'idle') return;

    const text = input.value.trim();
    if (!text) {
      setStatus('Type something first, or tap the mic and say it.', 'error');
      input.focus();
      return;
    }

    const key = voice + '\u0000' + text;
    setMode('loadingTts');
    try {
      if (key !== lastKey) {
        setStatus('Generating speech…');
        const res = await fetch(API_TTS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ text, voice })
        });
        if (!res.ok) throw new Error(await readError(res));
        const blob = await res.blob();
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        lastKey = key;
      }
      await playUrl(lastUrl);
    } catch (err) {
      endPlayback();
      setStatus(friendly(err), 'error');
    }
  }

  async function playUrl(url) {
    audio = new Audio(url);
    audio.addEventListener('ended', () => { endPlayback(); setStatus(''); });
    audio.addEventListener('error', () => { endPlayback(); setStatus('The audio couldn’t be played. Try again.', 'error'); });
    attachAnalyser(audio);
    await audio.play();
    setMode('playing');
    setStatus('Speaking…');
    startEq();
  }

  function attachAnalyser(el) {
    analyser = null;
    try {
      playCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = playCtx.createMediaElementSource(el);
      analyser = playCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      analyser.connect(playCtx.destination);
    } catch (e) {
      analyser = null;                    // falls back to the CSS animation
    }
  }

  function startEq() {
    if (!analyser) { eq.classList.remove('live'); return; }
    eq.classList.add('live');
    const data = new Uint8Array(analyser.frequencyBinCount);
    const bins = [2, 5, 9, 16];           // low to high voice frequencies
    const tick = () => {
      analyser.getByteFrequencyData(data);
      eqBars.forEach((b, i) => {
        const v = Math.min(1, (data[bins[i]] / 255) * 1.4);
        b.style.height = (18 + v * 82) + '%';
      });
      eqRaf = requestAnimationFrame(tick);
    };
    tick();
  }

  function endPlayback() {
    cancelAnimationFrame(eqRaf);
    eqBars.forEach(b => { b.style.height = ''; });
    eq.classList.remove('live');
    if (audio) { audio.pause(); audio = null; }
    if (playCtx) { playCtx.close(); playCtx = null; }
    analyser = null;
    if (mode !== 'idle') setMode('idle');
  }

  speakBtn.addEventListener('click', speak);

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (mode === 'recording') cancelRecording();
    else if (mode === 'playing') { endPlayback(); setStatus(''); }
  });

  /* ---------- start ---------- */
  setMode('idle');
  autosize();
  refresh();
})();
</script>
</body>
</html>
