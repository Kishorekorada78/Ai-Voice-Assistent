<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>Voice Transcriber</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    button { padding: 12px 24px; font-size: 16px; margin-right: 8px; }
    #result { margin-top: 20px; padding: 12px; border: 1px solid #ccc; min-height: 60px; }
  </style>
</head>
<body>
  <h2>🎙️ Voice to Text</h2>
  <button id="start">Start Recording</button>
  <button id="stop" disabled>Stop & Transcribe</button>
  <div id="status"></div>
  <div id="result"></div>

  <script>
    let recorder, chunks = [];

    document.getElementById('start').onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, noiseSuppression: true, echoCancellation: true }
      });
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = send;
      recorder.start();
      document.getElementById('start').disabled = true;
      document.getElementById('stop').disabled = false;
      document.getElementById('status').innerText = 'Recording...';
    };

    document.getElementById('stop').onclick = () => {
      recorder.stop();
      recorder.stream.getTracks().forEach(t => t.stop());
      document.getElementById('start').disabled = false;
      document.getElementById('stop').disabled = true;
      document.getElementById('status').innerText = 'Transcribing...';
    };

    async function send() {
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const form = new FormData();
      form.append('file', blob, 'voice.webm');
      const res = await fetch('/api/stt/transcribe', { method: 'POST', body: form });
      const data = await res.json();
      document.getElementById('result').innerText = data.text || JSON.stringify(data);
      document.getElementById('status').innerText = '';
    }
  </script>
</body>
</html>
