spring.application.name=voice-transcriber
server.port=8080

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.3

app.tts.model=gemini-3.8-flash-lite-tts

# Development only: shows real error messages in the page. Remove before sharing the app.
server.error.include-message=always

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

